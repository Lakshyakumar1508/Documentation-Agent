[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docagent"
version = "0.1.0"
description = "Production Intelligent Documentation Agent."
authors = [{ name = "DocAgent Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    "langchain-openai>=0.1.0",
    "openai>=1.14.0",
    "gitpython>=3.1.42",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "pyyaml>=6.0.1",
    "typer>=0.9.0",
    "rich>=13.7.1",
    "httpx>=0.27.0",
    "cryptography>=42.0.5",
    "PyJWT>=2.8.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
docagent = "docagent.cli.main:main"

